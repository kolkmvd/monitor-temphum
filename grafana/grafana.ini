# Overrides merged on top of Grafana's baked-in defaults.ini.
#
# Fixes the high idle CPU of Grafana 11-13 (see grafana/grafana#126369): the
# dashboard-cleanup job defaults to every 30s and hammers grafana.db. There is
# no on/off switch, so set the interval so large it effectively never runs (it
# still runs once at startup). The env var GF_DASHBOARD_CLEANUP_INTERVAL is
# bugged (ignored) until PR #128143 ships, so it must be set here.
# At this scale the only downside is that old dashboard versions / expired
# snapshots & tokens are not pruned -- negligible for one dashboard.
[dashboard_cleanup]
interval = 8760h

# Single-instance: skip DB-backed HA coordination (some work runs in-process).
[database]
high_availability = false
