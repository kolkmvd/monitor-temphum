apiVersion: 1

groups:
  - orgId: 1
    name: temphum
    folder: Alerts
    interval: 1m
    rules:
      - uid: humidity-out-of-range
        title: Luchtvochtigheid buiten 40-60%
        condition: C
        for: 5m
        # A: current humidity from Prometheus; C: fire when out of the 40-60% band.
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              expr: sht45_humidity_percent
              instant: true
              range: false
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange:
              from: 0
              to: 0
            model:
              refId: C
              type: math
              expression: "$A < 40 || $A > 60"
        noDataState: NoData
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "Luchtvochtigheid buiten bereik (40-60%)"

      - uid: sensor-offline
        title: Sensor offline
        condition: C
        for: 2m
        # Fires when sht45_up == 0 (read failing) OR the metric is absent
        # entirely (exporter down -> no scrape -> NoData -> Alerting).
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              expr: sht45_up
              instant: true
              range: false
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange:
              from: 0
              to: 0
            model:
              refId: C
              type: math
              expression: "$A < 1"
        noDataState: Alerting
        execErrState: Error
        labels:
          severity: critical
        annotations:
          summary: "SHT45 sensor offline (geen meting)"
