# monitor-temphum -- SHT45 SCPI sensor -> Prometheus + Grafana.
#
# The three services share an internal app network (temphum-app). Grafana is
# additionally attached to an existing Traefik proxy network (webgateway) and
# published at https://${GRAFANA_HOST}/grafana. Machine-specific values (serial
# port, location, host) live in .env next to this file.
#
# webgateway is declared external: it must already exist (created by the Traefik
# stack). Windows/macOS Docker Desktop can't pass USB through -- run the exporter
# on the host there and point Prometheus at host.docker.internal:9101 instead.

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: temphum-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - temphum-app
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:latest
    container_name: temphum-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      # D3 Gauge panel plugin used by the dashboard (downloaded at startup).
      - GF_INSTALL_PLUGINS=briangann-gauge-panel
      # Served under the /grafana sub-path behind Traefik.
      - GF_SERVER_ROOT_URL=https://${GRAFANA_HOST}/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
      # Unified alerting on (for the <40% / >60% humidity alert); legacy off.
      - GF_UNIFIED_ALERTING_ENABLED=true
      - GF_ALERTING_ENABLED=false
      # Trim idle CPU: no phone-home, no Live.
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
      - GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES=false
      - GF_LIVE_MAX_CONNECTIONS=0
      # Silence the benign app-platform search / manifest-watcher warn spam.
      - GF_LOG_FILTERS=search-manifest-watcher:error bleve-backend:error resource-search:error
      # SQLite WAL mode: fewer "database is locked" retries.
      - GF_DATABASE_WAL=true
    volumes:
      - ./grafana/grafana.ini:/etc/grafana/grafana.ini:ro
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - temphum-app
      - webgateway
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=webgateway"
      - "traefik.http.routers.temphum-grafana.rule=Host(`${GRAFANA_HOST}`) && PathPrefix(`/grafana`)"
      - "traefik.http.routers.temphum-grafana.entrypoints=websecure"
      - "traefik.http.routers.temphum-grafana.tls=true"
      - "traefik.http.routers.temphum-grafana.tls.certresolver=letsencrypt"
      - "traefik.http.services.temphum-grafana.loadbalancer.server.port=3000"

  # Exporter in a container with USB passthrough (Linux host).
  #
  # Hot-plug friendly: instead of pinning one device node (which goes stale when
  # a replug renumbers ttyACMx), we mount the /dev tree so new nodes + by-id
  # symlinks appear live, and allow any ttyACM (major 166) via cgroup. The
  # exporter opens the stable by-id path and reconnects on its own after an
  # unplug -- no container restart or recreate needed.
  #
  # Trade-off: mounting /dev makes all host device nodes *visible* to the
  # container, but the cgroup rule still only grants *access* to ttyACM devices.
  exporter:
    build: ./exporter
    container_name: temphum-exporter
    restart: unless-stopped
    # Run tini as PID 1 so SIGTERM reaches Python and the container stops fast
    # (a bare Python PID 1 ignores SIGTERM -> Docker waits the full 10s timeout).
    init: true
    ports:
      - "9101:9101"
    environment:
      # Machine-specific: set these in a .env file next to this compose file.
      - SCPI_PORT=${SCPI_PORT}
      - LOCATION=${LOCATION:-}
      - POLL_INTERVAL=5
      # Humidity limits (%), pushed to the Trinkey on connect; they drive the
      # status LED (green inside, amber within WARN of a limit, red outside).
      - HUM_LOW=35
      - HUM_HIGH=70
      - HUM_WARN=5
      - BRIGHTNESS=0.2   # status-LED brightness 0..1
      # Calibration vs a reference next to the Trinkey (offset = ref - trinkey).
      - TEMP_OFFSET=-3.0   # degC added to temperature (self-heating)
      - HUM_OFFSET=5.7     # %RH residual after curve compensation
    volumes:
      - /dev:/dev
    device_cgroup_rules:
      - "c 166:* rmw"
    networks:
      - temphum-app

networks:
  temphum-app:
    driver: bridge
  webgateway:
    external: true

volumes:
  prometheus-data:
  grafana-data:
